version: 2

# Actions are pinned to commit SHAs (see the `# vX.Y.Z` comments in
# .github/workflows/). Dependabot is what keeps those SHAs from going stale: it
# moves them through a reviewable PR instead of a tag repoint nobody sees.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
