name: Release

# Runs on every push to `main`. Bumps the version at the level the conventional commits since
# the last tag call for, pushes a `chore(release): vX.Y.Z` commit + matching `vX.Y.Z` tag back
# to main, publishes to npm with provenance, and creates a GitHub Release.
#
# Bump level (see the `level` job step): `!` / `BREAKING CHANGE` → minor while 0.x, major from
# 1.0.0 on; `feat` → minor; anything else → patch.
#
# Required secrets:
#   NPM_TOKEN      — npm automation token with publish scope on @loontail/minecraft-kit.
#   RELEASE_TOKEN  — fine-grained PAT (Contents: read/write) owned by a user in the
#                    repo's branch ruleset bypass list. The default GITHUB_TOKEN cannot
#                    push directly to a protected `main`; RELEASE_TOKEN can.
#
# Loop guard: the bump commit (`chore(release): vX.Y.Z`) triggers this workflow
# again; the guard job short-circuits when the commit message begins with
# `chore(release):` so the release does not chain into itself.
#
# To override the derived level, bump the version locally with
# `npm version <level> --no-git-tag-version`, commit as `chore(release): vX.Y.Z`, push — the
# workflow guard treats it as a release commit (skips), and the next regular commit on `main`
# releases from that baseline.
#
# Token shape: `bump` holds RELEASE_TOKEN and runs no third-party code (no
# `npm ci`). `release` runs the dev tree and holds `contents: write` +
# `id-token: write`, so any package in that tree could in principle edit releases
# or mint an OIDC token to forge npm provenance — the residual risk that only a
# build/publish split with an intermediate artifact would remove. It is kept here
# because npm publish must run from the built tree.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if echo "$MESSAGE" | grep -qE '^chore\(release\):'; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Release commit detected — skipping."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure required secrets are configured
        if: steps.check.outputs.proceed == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          missing=()
          [ -z "$NPM_TOKEN" ] && missing+=("NPM_TOKEN")
          [ -z "$RELEASE_TOKEN" ] && missing+=("RELEASE_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}. Set them under Settings → Secrets and variables → Actions before pushing to main."
            exit 1
          fi

  # why this job exists BEFORE bump: the tag and the `chore(release):` commit used to be
  # pushed to main first, with the gates running only in the publish job afterwards. A
  # red suite therefore left main permanently carrying a release commit and a tag
  # pointing at code no gate ever accepted — with no npm publish and no GitHub Release,
  # a version hole the next run silently skips past. `check:api` runs here rather than
  # in the publish job on purpose: it diffs the public surface against the LAST tag, so
  # it is only meaningful before the new tag exists.
  gate:
    name: Gate (typecheck / lint / test / build / exports / api)
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:exports
      - run: npm run check:api

  bump:
    name: Bump version
    needs: [guard, gate]
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # PAT belongs to a repo admin (bypass list), so the push below bypasses
          # the "Require pull request" ruleset on main. This job deliberately runs
          # no `npm ci` — nothing third-party executes while the PAT is on disk.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12"
          cache: npm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The level comes from the conventional commits since the last release tag, not from a
      # hard-coded `patch`: a `feat!:` that removed exported names used to ship as a patch, so a
      # consumer on a caret range was handed a compile break. `!` / `BREAKING CHANGE` is a minor
      # while the package is 0.x (0.x has no major channel) and a major from 1.0.0 on.
      - name: Resolve bump level
        id: level
        run: |
          last_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          range="HEAD"
          [ -n "$last_tag" ] && range="${last_tag}..HEAD"
          log=$(git log --format='%s%n%b%n--' "$range")
          major=$(node -p "require('./package.json').version.split('.')[0]")
          if printf '%s' "$log" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE'; then
            if [ "$major" = "0" ]; then level=minor; else level=major; fi
          elif printf '%s' "$log" | grep -qE '^feat(\([^)]*\))?:'; then
            level=minor
          else
            level=patch
          fi
          echo "Commits in ${range} resolve to a ${level} bump."
          echo "level=${level}" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        run: |
          version=$(npm version "${{ steps.level.outputs.level }}" --no-git-tag-version)
          plain="${version#v}"
          tag="v${plain}"
          git add package.json package-lock.json
          git commit -m "chore(release): ${tag}"
          git tag "${tag}"
          git push origin HEAD:main
          git push origin "${tag}"
          echo "version=${plain}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  release:
    name: Publish to npm
    needs: bump
    runs-on: ubuntu-latest
    # `contents: write` lets the job create a GitHub Release. `id-token: write`
    # enables npm provenance.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Build and publish from the bump tag exactly. If anything else lands on
          # main while this job is queued, we still ship the version we tagged.
          ref: ${{ needs.bump.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      # Re-run every gate even though ci.yml already ran them on the merged PR —
      # this is the last point where we can stop a bad publish.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Resolution shape of the tarball about to be published. Cheap, and the only gate that
      # sees the export map the way a consumer's TypeScript will.
      - run: npm run check:exports

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          name: ${{ needs.bump.outputs.tag }}
          generate_release_notes: true
