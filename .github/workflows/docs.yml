name: Deploy Docs

# Builds the VitePress site (after regenerating the TypeDoc API) and publishes it to
# GitHub Pages. Runs on every push to `main`. Can also be triggered manually from the
# Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# why: `pages: write` + `id-token: write` live on the `deploy` job only. The
# `build` job runs `npm ci` and the whole docs toolchain, so anything in that dev
# tree would otherwise hold a token able to publish to Pages and to mint an OIDC
# token in this repo's identity.
permissions:
  contents: read

# Only one Pages deploy at a time. `cancel-in-progress: false` means a new deploy waits
# for the current one to finish rather than cancelling it — preserves history of every
# published change.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # pages: read — configure-pages reads the site config (GET /repos/../pages) to
    # derive base_url. Read is enough; publishing needs write, which only `deploy`
    # gets.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # `docs:build` runs TypeDoc → VitePress build. Output lands in
      # docs-site/.vitepress/dist.
      - run: npm run docs:build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
