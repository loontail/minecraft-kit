name: Deploy Docs

# Builds the VitePress site (after regenerating the TypeDoc API) and publishes it to
# GitHub Pages. Runs on every push to `main`. Can also be triggered manually from the
# Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# why: `pages: write` + `id-token: write` live on the `deploy` job only. The
# `build` job runs `npm ci` and the whole docs toolchain, so anything in that dev
# tree would otherwise hold a token able to publish to Pages and to mint an OIDC
# token in this repo's identity.
permissions:
  contents: read

# Only one Pages deploy at a time. `cancel-in-progress: false` means a new deploy waits
# for the current one to finish rather than cancelling it — preserves history of every
# published change.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # pages: read — configure-pages reads the site config (GET /repos/../pages) to
    # derive base_url. Read is enough; publishing needs write, which only `deploy`
    # gets.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12"
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # `docs:build` runs TypeDoc → VitePress build. Output lands in
      # docs-site/.vitepress/dist.
      - run: npm run docs:build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
